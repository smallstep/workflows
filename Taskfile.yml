version: "3"

vars:
  # BEGIN generated by .github/scripts/generate-versions; DO NOT EDIT
  GO: 1.27.0
  AIR: 1.67.4
  GOIMPORTS: 0.49.0
  GOPLS: 0.23.0
  GOVULNCHECK: 1.7.0
  GOLANGCI_LINT: 2.13.1
  GOLANGCI_LINT_LANGSERVER: 0.0.12
  GOTESTSUM: 1.13.0
  MIRRORD: 3.251.0
  # END generated

  # The defaults a repository may override through its include's vars.
  GOIMPORTS_LOCAL: go.step.sm/,github.com/smallstep/
  TEST_FLAGS: -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
  LINT_FLAGS: --timeout=30m
  GOLANGCI_CONFIG_URL: https://raw.githubusercontent.com/smallstep/workflows/main/.golangci.yml

tasks:
  pins:
    desc: print the tool versions this Taskfile pins
    silent: true
    cmds:
      - echo "go            {{.GO}}"
      - echo "golangci-lint {{.GOLANGCI_LINT}}"
      - echo "goimports     {{.GOIMPORTS}}"
      - echo "gotestsum     {{.GOTESTSUM}}"
      - echo "govulncheck   {{.GOVULNCHECK}}"
      - echo "air           {{.AIR}}"
      - echo "mirrord       {{.MIRRORD}}"

  check:
    desc: warn about the tools on PATH that are not on pinned versions
    silent: true
    cmds:
      - |
        found="$(go env GOVERSION || true)"
        [ "$found" = "go{{.GO}}" ] ||
          echo "warning: $found on PATH; pinned go{{.GO}}" >&2
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          found="$(golangci-lint version --short 2>/dev/null || true)"
          [ "${found:-unknown}" = "{{.GOLANGCI_LINT}}" ] ||
            echo "warning: golangci-lint ${found:-of unknown version} on PATH; pinned {{.GOLANGCI_LINT}}" >&2
        fi
      - |
        if command -v gotestsum >/dev/null 2>&1; then
          found="$(gotestsum --version 2>/dev/null || true)"
          found="${found##* }"
          found="${found#v}"
          [ -z "$found" ] || [ "$found" = "{{.GOTESTSUM}}" ] ||
            echo "warning: gotestsum $found on PATH; pinned {{.GOTESTSUM}} (tasks run the pinned one)" >&2
        fi
      - |
        # the module version baked into the binary, without awk: Task's own
        # shell on Windows has none
        if command -v goimports >/dev/null 2>&1; then
          found=""
          while read -r kind _ version _; do
            if [ "$kind" = "mod" ]; then found="${version#v}"; fi
          done <<EOF
        $(go version -m "$(command -v goimports)" 2>/dev/null || true)
        EOF
          [ -z "$found" ] || [ "$found" = "{{.GOIMPORTS}}" ] ||
            echo "warning: goimports $found on PATH; pinned {{.GOIMPORTS}} (tasks run the pinned one)" >&2
        fi
      - |
        # the module version baked into the binary, without awk: Task's own
        # shell on Windows has none
        if command -v govulncheck >/dev/null 2>&1; then
          found=""
          while read -r kind _ version _; do
            if [ "$kind" = "mod" ]; then found="${version#v}"; fi
          done <<EOF
        $(go version -m "$(command -v govulncheck)" 2>/dev/null || true)
        EOF
          [ -z "$found" ] || [ "$found" = "{{.GOVULNCHECK}}" ] ||
            echo "warning: govulncheck $found on PATH; pinned {{.GOVULNCHECK}} (tasks run the pinned one)" >&2
        fi
      - |
        # the module version baked into the binary, without awk: Task's own
        # shell on Windows has none
        if command -v air >/dev/null 2>&1; then
          found=""
          while read -r kind _ version _; do
            if [ "$kind" = "mod" ]; then found="${version#v}"; fi
          done <<EOF
        $(go version -m "$(command -v air)" 2>/dev/null || true)
        EOF
          [ -z "$found" ] || [ "$found" = "{{.AIR}}" ] ||
            echo "warning: air $found on PATH; pinned {{.AIR}} (tasks run the pinned one)" >&2
        fi

  # --- runners: one tool each, at the pinned version, with the caller's args

  goimports:
    desc: run goimports with the given arguments
    cmds:
      - go run golang.org/x/tools/cmd/goimports@v{{.GOIMPORTS}} {{.ARGS}} {{.CLI_ARGS}}

  gotestsum:
    desc: run gotestsum with the given arguments
    cmds:
      - go run gotest.tools/gotestsum@v{{.GOTESTSUM}} {{.ARGS}} {{.CLI_ARGS}}

  govulncheck:
    desc: run govulncheck with the given arguments
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v{{.GOVULNCHECK}} {{.ARGS}} {{.CLI_ARGS}}

  air:
    desc: run air with the given arguments
    cmds:
      - go run github.com/air-verse/air@v{{.AIR}} {{.ARGS}} {{.CLI_ARGS}}

  golangci-lint:
    desc: run golangci-lint with the given arguments
    cmds:
      - cmd: |
          if ! command -v golangci-lint >/dev/null 2>&1; then
            echo "golangci-lint is not on PATH; pinned {{.GOLANGCI_LINT}}:" >&2
            echo "  https://github.com/golangci/golangci-lint/releases/tag/v{{.GOLANGCI_LINT}}" >&2
            exit 1
          fi
          found="$(golangci-lint version --short 2>/dev/null || true)"
          [ "${found:-unknown}" = "{{.GOLANGCI_LINT}}" ] ||
            echo "warning: golangci-lint ${found:-of unknown version} on PATH; pinned {{.GOLANGCI_LINT}}" >&2
        silent: true
      - golangci-lint {{.ARGS}} {{.CLI_ARGS}}

  # --- stock tasks: the defaults, built on the runners

  fmt:
    desc: format the Go sources with goimports and the local import groups
    cmds:
      - task: goimports
        vars:
          ARGS: -local {{.GOIMPORTS_LOCAL}} -l -w .

  lint:
    desc: lint with golangci-lint and govulncheck, using the repository's own config or the shared one
    deps: [check]
    vars:
      OWN_CONFIG:
        sh: |
          for f in .golangci.yml .golangci.yaml .golangci.toml .golangci.json; do
            if [ -f "$f" ]; then
              echo "$f"
              break
            fi
          done
      # The shared config is fetched on every run, into a temporary file whose
      # extension tells golangci-lint the format; nothing is kept around.
      CONFIG:
        sh: |
          if [ -n "{{.OWN_CONFIG}}" ]; then
            echo "{{.OWN_CONFIG}}"
          else
            f="$(mktemp)" && mv "$f" "$f.yml" && echo "$f.yml"
          fi
    cmds:
      - defer: '{{if .OWN_CONFIG}}{{else}}rm -f "{{.CONFIG}}"{{end}}'
      - cmd: '{{if .OWN_CONFIG}}{{else}}curl -fsSL -o "{{.CONFIG}}" "{{.GOLANGCI_CONFIG_URL}}"{{end}}'
        silent: true
      - task: golangci-lint
        vars:
          ARGS: run --config "{{.CONFIG}}" {{.LINT_FLAGS}}
      - task: govulncheck
        vars:
          ARGS: ./...

  test:
    desc: run the tests with gotestsum
    deps: [check]
    cmds:
      - task: gotestsum
        vars:
          ARGS: -- {{.TEST_FLAGS}}

  vuln:
    desc: scan the module with govulncheck
    cmds:
      - task: govulncheck
        vars:
          ARGS: ./...
