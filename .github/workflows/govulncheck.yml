on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      os-dependencies:
        required: false
        type: string
      goprivate:
        required: false
        type: string
        default: go.step.sm/,github.com/smallstep/
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      PAT:
        required: false

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ${{ inputs.runs-on }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      - name: Install Dependencies # Some dependencies require this package
        if: ${{ inputs.os-dependencies != '' }}
        shell: bash
        env:
          OS_DEPS: ${{ inputs.os-dependencies }}
        run: |
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              # shellcheck disable=SC2086
              sudo apt-get install -y ${OS_DEPS}
              ;;
            macOS)
              # shellcheck disable=SC2086
              brew install ${OS_DEPS}
              ;;
            Windows)
              # shellcheck disable=SC2086
              choco install -y ${OS_DEPS}
              ;;
            *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Reconfigure Git for go.step.sm
        env:
          PAT: ${{ secrets.PAT }}
        if: ${{ env.PAT != '' }}
        run: |
          git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf git+ssh://git@github.com
          git config --global url.git@github.com:.insteadOf https://github.com/
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: Setup SSH key for private dependencies
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
