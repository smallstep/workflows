name: CI

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionci:
    uses: ./.github/workflows/actionci.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  test-pinned-versions:
    name: Test pinned version files
    runs-on: ubuntu-latest
    env:
      MISE_MINIMUM_RELEASE_AGE: 0 # versions are pinned
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The rest of this job takes its versions from the action, the way a
      # caller does. Whether the action reports the right ones is the versions
      # action job's business.
      - name: Read the pins
        id: pins
        uses: ./.github/actions/versions

      - name: Setup the pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          check-latest: false

      - name: Check .versions and Taskfile.yml agree with .versions.json
        shell: bash
        run: |
          set -euo pipefail

          cp .versions "${RUNNER_TEMP}/versions.committed"
          cp Taskfile.yml "${RUNNER_TEMP}/Taskfile.committed"
          .github/scripts/generate-versions --no-refresh

          if ! diff -u "${RUNNER_TEMP}/versions.committed" .versions; then
            echo "::error::.versions is not what .versions.json flattens to; run .github/scripts/generate-versions"
            exit 1
          fi
          if ! diff -u "${RUNNER_TEMP}/Taskfile.committed" Taskfile.yml; then
            echo "::error::Taskfile.yml does not carry the pins in .versions.json; run .github/scripts/generate-versions"
            exit 1
          fi

      - name: Check the shared Taskfile parses and lists its tasks
        shell: bash
        run: |
          set -euo pipefail
          mise install task@3.53.1
          mise exec task@3.53.1 -- task --list-all
          mise exec task@3.53.1 -- task pins

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      # NOTE(@azazeal): .versions doubles as a .tool-versions, so we check
      # whether mise can resolve
      - name: Check mise resolves every pin
        shell: bash
        run: |
          set -euo pipefail

          failed=0

          while read -r key value; do
            case "${key}" in
              ''|\#*) continue ;;
            esac

            if [ "$(mise latest "${key}@${value}" 2>&1)" = "${value}" ]; then
              echo "ok       ${key} ${value}"
            else
              echo "::error::mise cannot resolve ${key}@${value}"
              failed=1
            fi
          done < .versions

          exit "${failed}"

      - name: Verify .golangci.yml against the pinned golangci-lint
        shell: bash
        env:
          GOLANGCI_LINT: ${{ steps.pins.outputs['golangci-lint'] }}
        run: |
          set -euo pipefail

          mise install "golangci-lint@${GOLANGCI_LINT}"
          mise exec "golangci-lint@${GOLANGCI_LINT}" -- \
            golangci-lint config verify --config=.golangci.yml

      - name: Point the dummy app at the pinned Go
        shell: bash
        env:
          GO_VERSION: ${{ steps.pins.outputs.go }}
        run: |
          set -euo pipefail

          sed -i -E "s/^go .*/go ${GO_VERSION}/" lintapp/go.mod
          cat lintapp/go.mod

      - name: Lint the dummy app with the pinned golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: lintapp
          version: v${{ steps.pins.outputs['golangci-lint'] }}
          verify: true
          args: --config=../.golangci.yml

      - name: Test the dummy app with the pinned gotestsum
        working-directory: lintapp
        shell: bash
        env:
          GOTESTSUM: ${{ steps.pins.outputs.gotestsum }}
        run: |
          set -euo pipefail

          mise install "gotestsum@${GOTESTSUM}"
          mise exec "gotestsum@${GOTESTSUM}" -- gotestsum -- ./...

  test-pinned-versions-action:
    name: Validate the versions action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Determine the pinned tool versions
        id: pins
        uses: ./.github/actions/versions

      - name: Check the pinned tool versions
        shell: bash
        env:
          OUTPUTS: ${{ toJSON(steps.pins.outputs) }}
        run: |
          set -euo pipefail

          # NOTE(@azazeal): the jq on a Windows runner is a native build, so it
          # writes CRLF while the awk next to it writes LF. Every list loses
          # its \r before it is compared, or the three never match there.
          pinned="$(awk '!/^#/ && NF { sub("^go:", "", $1); print $1, $2 }' \
            .versions | tr -d '\r' | sort)"

          reported="$(printf '%s' "${OUTPUTS}" |
            jq -r 'del(.__json) | to_entries[] | "\(.key) \(.value)"' |
            tr -d '\r' | sort)"

          resolved="$(printf '%s' "${OUTPUTS}" |
            jq -r '.__json | fromjson | to_entries[] | "\(.key) \(.value)"' |
            tr -d '\r' | sort)"

          if [ "${pinned}" != "${reported}" ] ||
            [ "${pinned}" != "${resolved}" ]; then
            printf '.versions holds:\n%s\n\nthe outputs hold:\n%s\n\n__json holds:\n%s\n' \
              "${pinned}" "${reported}" "${resolved}"
            echo "::error::the action does not report what .versions holds"
            exit 1
          fi
