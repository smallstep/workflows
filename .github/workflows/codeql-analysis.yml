name: "CodeQL"

on:
  workflow_call:
    inputs:
      codeql-make-bootstrap:
        required: false
        type: boolean
      codeql-build-cmd:
        required: false
        type: string
        default: 'V=1 make build'
      goprivate:
        required: false
        type: string
        default: go.step.sm,github.com/smallstep
      os-dependencies:
        required: false
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      PAT:
        required: false

jobs:
  codeql-analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    steps:
      -
        name: Install Dependencies
        if: ${{ inputs.os-dependencies != '' }}
        env:
          OS_DEPS: ${{ inputs.os-dependencies }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install ${OS_DEPS}
      -
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      -
        name: Setup Go
        id: setup-go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
      -
        name: chmod cache dir
        if: steps.setup-go.outputs.cache-hit == 'true'
        run: |
          chmod -R 0755 \
            ~/.cache/go-build \
            ~/go/pkg/mod || true
      -
        name: Action Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      -
        name: Setup SSH key for private dependencies
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
      -
        name: Reconfigure Git for private repos
        env:
          PAT: ${{ secrets.PAT }}
        if: ${{ env.PAT != '' }}
        run: |
          git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf git+ssh://git@github.com
          git config --global url.git@github.com:.insteadOf https://github.com/
      -
        # Initializes the CodeQL tools for scanning.
        name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality     # use Canonical suite
          packs: codeql/go-queries          # and pin the official pack explicitly
      -
        name: Make bootstrap
        if: inputs.codeql-make-bootstrap
        run: |
          make bootstrap
      -
        name: Build
        env:
          CODEQL_BUILD_CMD: ${{ inputs.codeql-build-cmd }}
        run: |
          eval "${CODEQL_BUILD_CMD}"
      -
        name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          output: codeql-results
          category: "/language:${{ matrix.language }}"
