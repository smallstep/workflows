on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      build-command:
        required: false
        type: string
        default: "V=1 make build"
      os-dependencies:
        required: false
        type: string
      only-latest-golang:
        required: false
        type: boolean
        default: true
      goprivate:
        required: false
        type: string
        default: go.step.sm/,github.com/smallstep/
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      PAT:
        required: false

permissions:
  contents: read

jobs:
  set-go-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-output.outputs.matrix }}
    steps:
      - name: Set go-matrix latest version
        id: set-matrix-latest
        if: inputs.only-latest-golang
        run: |
          echo 'matrix={"include":[{"go":"\"stable\""}]}' >> "${GITHUB_ENV}"
      - name: Set default go-matrix
        id: set-matrix-default
        if: inputs.only-latest-golang == false
        run: |
          echo 'matrix={"include":[{"go":"\"stable\""},{"go":"\"oldstable\""}]}' >> "${GITHUB_ENV}"
      - id: set-output
        run: |
          echo "matrix=${{ env.matrix }}" >> "${GITHUB_OUTPUT}"

  build:
    needs: set-go-matrix
    runs-on: ${{ inputs.runs-on }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    strategy:
      matrix: ${{ fromJson(needs.set-go-matrix.outputs.matrix) }}
    steps:
      - name: Install Dependencies # Some dependencies require this package
        if: ${{ inputs.os-dependencies != '' }}
        shell: bash
        env:
          OS_DEPS: ${{ inputs.os-dependencies }}
        run: |
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              # shellcheck disable=SC2086
              sudo apt-get install -y ${OS_DEPS}
              ;;
            macOS)
              # shellcheck disable=SC2086
              brew install ${OS_DEPS}
              ;;
            Windows)
              # shellcheck disable=SC2086
              choco install -y ${OS_DEPS}
              ;;
            *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Reconfigure Git for go.step.sm
        env:
          PAT: ${{ secrets.PAT }}
        if: ${{ env.PAT != '' }}
        run: |
          git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf git+ssh://git@github.com
          git config --global url.git@github.com:.insteadOf https://github.com/
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: Setup SSH key for private dependencies
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: ${{ env.SSH_PRIVATE_KEY != '' }}
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Build
        shell: bash
        env:
          BUILD_CMD: ${{ inputs.build-command }}
        run: eval "${BUILD_CMD}"
