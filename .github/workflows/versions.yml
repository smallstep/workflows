name: Sync .versions

on:
  schedule:
    - cron: '0 22 * * *' # Daily, 22:00 UTC, which is 15:00 in SF while DST is on
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: ci/versions
      MISE_MINIMUM_RELEASE_AGE: 0 # versions are pinned
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - name: Regenerate .versions.json and .versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/generate-versions

      - name: Look for changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --quiet -- .versions .versions.json Taskfile.yml; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "already up to date"
            exit 0
          fi

          echo "found=true" >> "${GITHUB_OUTPUT}"
          git --no-pager diff -- .versions .versions.json Taskfile.yml

      - name: Check nobody else wrote the branch
        if: steps.changes.outputs.found == 'true'
        env:
          BOT: 41898282+github-actions[bot]@users.noreply.github.com
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! author="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BRANCH}" \
            --jq '.commit.author.email' 2>/dev/null)"; then
            echo "${BRANCH} is not there yet"
            exit 0
          fi

          if [ "${author}" != "${BOT}" ]; then
            written_by="${BRANCH} was last written by ${author}"
            echo "::error title=Sync versions::${written_by}; refusing to write over it"
            exit 1
          fi

      - name: Setup mise
        if: steps.changes.outputs.found == 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 7d
          install: false

      - name: Check mise resolves every pin
        if: steps.changes.outputs.found == 'true'
        run: |
          set -euo pipefail

          failed=0

          while read -r key value; do
            case "${key}" in
              ''|\#*) continue ;;
            esac

            if [ "$(mise latest "${key}@${value}" 2>&1)" = "${value}" ]; then
              echo "ok       ${key} ${value}"
            else
              echo "::error::mise cannot resolve ${key}@${value}"
              failed=1
            fi
          done < .versions

          exit "${failed}"

      - name: Describe the change
        id: describe
        if: steps.changes.outputs.found == 'true'
        run: |
          set -euo pipefail

          old="$(mktemp)"
          git show 'HEAD:.versions.json' > "${old}" 2>/dev/null || echo '{}' > "${old}"

          # NOTE(@azazeal): $comment is left out of the comparison as rewording
          # one is not a bump, and a run that only does that should not be
          # treated like a dependency bump. url is not left out, as it not only
          # carries the version, but denotes the origin too.
          changed="$(jq -r --slurpfile old "${old}" '
            ($old[0] // {}) as $was
            | to_entries
            | map(select(
                  (.value | del(.["$comment"]))
                  != (($was[.key] // {}) | del(.["$comment"]))
              ))
            | .[]
            | [.key, .value.version, .value.url]
            | @tsv
          ' .versions.json)"

          # shellcheck disable=SC2016
          bump() { printf '%s `%s` to [`%s`](%s).\n' "$1" "$2" "$3" "$4"; }

          body="${RUNNER_TEMP}/body.md"
          summary=""

          while IFS=$'\t' read -r name version url; do
            [ -n "${name}" ] || continue

            if [ -z "${summary}" ]; then
              summary="${name} to ${version}"
              bump "This PR bumps" "${name}" "${version}" "${url}" > "${body}"
            else
              summary="${summary}, ${name} to ${version}"
              { echo; bump "It also bumps" "${name}" "${version}" "${url}"; } >> "${body}"
            fi
          done <<< "${changed}"

          if [ -n "${summary}" ]; then
            title=".versions: bumped ${summary}"

            cat >> "${body}" <<'CAVEAT'

          _The updates suggested here have not been reviewed for any security issues._
          CAVEAT
          else
            title=".versions: regenerated"
            cat > "${body}" <<'FALLBACK'
          This PR regenerates `.versions` from `.versions.json`.
          FALLBACK
          fi

          {
            echo "title=${title}"
            echo "body=${body}"
            # A run that only reworded a comment is not a dependency bump, so it
            # does not carry the label either.
            if [ -n "${summary}" ]; then
              echo "labels=dependencies"
            else
              echo "labels="
            fi
          } >> "${GITHUB_OUTPUT}"

      - name: Open or update the pull request
        id: pr
        if: steps.changes.outputs.found == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: ${{ env.BRANCH }}
          add-paths: |
            .versions
            .versions.json
            Taskfile.yml
          sign-commits: true
          commit-message: ${{ steps.describe.outputs.title }}
          title: ${{ steps.describe.outputs.title }}
          body-path: ${{ steps.describe.outputs.body }}
          labels: ${{ steps.describe.outputs.labels }}

      - name: Drop the label from a run that bumped nothing
        if: >-
          steps.changes.outputs.found == 'true'
          && steps.describe.outputs.labels == ''
          && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          gh pr edit "${NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --remove-label dependencies || true
