on:
  workflow_call:
    inputs:
      build-command:
        required: false
        type: string
        default: "V=1 make build"
      codeql-build-cmd:
        required: false
        type: string
        default: "V=1 make build"
      codeql-build-mode:
        required: false
        type: string
        default: ""
      codeql-make-bootstrap:
        required: false
        type: boolean
      runs-on:
        required: false
        type: string
        default: ""
      build-runs-on:
        required: false
        type: string
        default: ""
      codeql-runs-on:
        required: false
        type: string
        default: ""
      govulncheck-runs-on:
        required: false
        type: string
        default: ""
      lint-runs-on:
        required: false
        type: string
        default: ""
      test-runs-on:
        required: false
        type: string
        default: ""
      golangci-lint-version:
        required: false
        type: string
        default: latest
      golangci-lint-args:
        required: false
        type: string
        default: "--timeout=30m"
      goprivate:
        required: false
        type: string
        default: go.step.sm/,github.com/smallstep/
      only-latest-golang:
        required: false
        type: boolean
        default: true
      os-dependencies:
        required: false
        type: string
        default: ""
      build-os-dependencies:
        required: false
        type: string
        default: ""
      codeql-os-dependencies:
        required: false
        type: string
        default: ""
      govulncheck-os-dependencies:
        required: false
        type: string
        default: ""
      lint-os-dependencies:
        required: false
        type: string
        default: ""
      test-os-dependencies:
        required: false
        type: string
        default: ""
      run-actionlint:
        required: false
        type: boolean
        default: true
      run-build:
        required: false
        type: boolean
        default: true
      run-codecov:
        required: false
        type: boolean
        default: true
      run-codeql:
        required: false
        type: boolean
        default: false
      run-govulncheck:
        required: false
        type: boolean
        default: true
      run-lint:
        required: false
        type: boolean
        default: true
      run-test:
        required: false
        type: boolean
        default: true
      setup-bats:
        required: false
        type: boolean
        default: false
      test-command:
        required: false
        type: string
        default: "gotestsum -- -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./..."
      lint-skip-go-generate:
        required: false
        type: boolean
        default: false
      lint-skip-go-mod-tidy:
        required: false
        type: boolean
        default: true
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      PAT:
        required: false
      CODECOV_TOKEN:
        required: false

jobs:
  lint:
    uses: ./.github/workflows/goLint.yml
    if: inputs.run-lint
    with:
      runs-on: ${{ inputs.lint-runs-on || inputs.runs-on || 'ubuntu-latest' }}
      goprivate: ${{ inputs.goprivate }}
      golangci-lint-version: ${{ inputs.golangci-lint-version }}
      golangci-lint-args: ${{ inputs.golangci-lint-args }}
      os-dependencies: ${{ inputs.lint-os-dependencies || inputs.os-dependencies || '' }}
      skip-go-generate: ${{ inputs.lint-skip-go-generate }}
      skip-go-mod-tidy: ${{ inputs.lint-skip-go-mod-tidy }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PAT: ${{ secrets.PAT }}

  govulncheck:
    uses: ./.github/workflows/govulncheck.yml
    if: inputs.run-govulncheck
    with:
      runs-on: ${{ inputs.govulncheck-runs-on || inputs.runs-on || 'ubuntu-latest' }}
      os-dependencies: ${{ inputs.govulncheck-os-dependencies || inputs.os-dependencies || '' }}
      goprivate: ${{ inputs.goprivate }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PAT: ${{ secrets.PAT }}

  # NOTE(@azazeal): callers that set run-codeql: true must also grant
  # security-events: write to the job that calls goCI.yml. Reusable workflows
  # cannot be granted more than the caller has.
  #
  # ref: https://docs.github.com/en/actions/reference/reusable-workflows-reference
  codeql:
    if: inputs.run-codeql
    uses: ./.github/workflows/codeql-analysis.yml
    with:
      runs-on: ${{ inputs.codeql-runs-on || inputs.runs-on || 'ubuntu-latest' }}
      goprivate: ${{ inputs.goprivate }}
      os-dependencies: ${{ inputs.codeql-os-dependencies || inputs.os-dependencies || '' }}
      make-bootstrap: ${{ inputs.codeql-make-bootstrap }}
      build-cmd: ${{ inputs.codeql-build-cmd }}
      build-mode: ${{ inputs.codeql-build-mode }}
    permissions:
      contents: read
      security-events: write
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PAT: ${{ secrets.PAT }}

  test:
    uses: ./.github/workflows/goTest.yml
    if: inputs.run-test
    with:
      runs-on: ${{ inputs.test-runs-on || inputs.runs-on || 'ubuntu-latest' }}
      goprivate: ${{ inputs.goprivate }}
      only-latest-golang: ${{ inputs.only-latest-golang }}
      os-dependencies: ${{ inputs.test-os-dependencies || inputs.os-dependencies || '' }}
      run-codecov: ${{ inputs.run-codecov }}
      setup-bats: ${{ inputs.setup-bats }}
      test-command: ${{ inputs.test-command }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PAT: ${{ secrets.PAT }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    uses: ./.github/workflows/goBuild.yml
    if: inputs.run-build
    with:
      runs-on: ${{ inputs.build-runs-on || inputs.runs-on || 'ubuntu-latest' }}
      build-command: ${{ inputs.build-command }}
      goprivate: ${{ inputs.goprivate }}
      only-latest-golang: ${{ inputs.only-latest-golang }}
      os-dependencies: ${{ inputs.build-os-dependencies || inputs.os-dependencies || '' }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PAT: ${{ secrets.PAT }}
