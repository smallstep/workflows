on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      goprivate:
        required: false
        type: string
        default: go.step.sm/,github.com/smallstep/
      gotestsum-version:
        required: false
        type: string
        default: "" # empty means take it from .versions
      only-latest-golang:
        required: false
        type: boolean
        default: true
      os-dependencies:
        required: false
        type: string
      run-codecov:
        required: false
        type: boolean
        default: true
      setup-bats:
        required: false
        type: boolean
        default: false
      test-command:
        required: false
        type: string
        default: "gotestsum -- -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./..."
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      PAT:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  set-go-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-output.outputs.matrix }}
    steps:
      - name: Set go-matrix latest version
        id: set-matrix-latest
        if: inputs.only-latest-golang
        run: |
          echo 'matrix={"include":[{"go":"\"stable\""}]}' >> "${GITHUB_ENV}"
      - name: Set default go-matrix
        id: set-matrix-default
        if: inputs.only-latest-golang == false
        run: |
          echo 'matrix={"include":[{"go":"\"stable\""},{"go":"\"oldstable\""}]}' >> "${GITHUB_ENV}"
      - id: set-output
        run: |
          echo "matrix=${{ env.matrix }}" >> "${GITHUB_OUTPUT}"

  test:
    needs: set-go-matrix
    runs-on: ${{ inputs.runs-on }}
    env:
      GOPRIVATE: ${{ inputs.goprivate }}
    strategy:
      matrix: ${{ fromJson(needs.set-go-matrix.outputs.matrix) }}
    steps:
      - name: Install Dependencies
        if: inputs.os-dependencies != ''
        shell: bash
        env:
          OS_DEPS: ${{ inputs.os-dependencies }}
        run: |
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              # shellcheck disable=SC2086
              sudo apt-get install -y ${OS_DEPS}
              ;;
            macOS)
              # shellcheck disable=SC2086
              brew install ${OS_DEPS}
              ;;
            Windows)
              # shellcheck disable=SC2086
              choco install -y ${OS_DEPS}
              ;;
            *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Reconfigure for Git go.step.sm
        if: env.PAT != ''
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf git+ssh://git@github.com
          git config --global url.git@github.com:.insteadOf https://github.com/

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Setup SSH key for private dependencies
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.SSH_PRIVATE_KEY != ''
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Resolve the gotestsum version
        id: version
        shell: bash
        env:
          OVERRIDE: ${{ inputs.gotestsum-version }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          # latest or "" means whatever's in .versions.
          if [ -n "${OVERRIDE}" ] && [ "${OVERRIDE}" != latest ]; then
            version="${OVERRIDE}"
          else
            versions="$(curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}/.versions")"

            version="$(printf '%s\n' "${versions}" | awk '$1 == "gotestsum" { print $2 }')"
            if [ -z "${version}" ]; then
              echo "::error::.versions at ${WORKFLOW_SHA} carries no gotestsum entry"
              exit 1
            fi
          fi

          # NOTE(@azazeal): a version may arrive with or without a leading v and
          # the tools expect one; anything else, latest for instance, is left
          # exactly as the caller wrote it.
          case "${version}" in
          v[0-9]*) ;;
          [0-9]*) version="v${version}" ;;
          esac

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install gotestsum
        shell: bash
        env:
          GOTESTSUM_VERSION: ${{ steps.version.outputs.version }}
        run: go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"

      - name: Setup BATS
        if: inputs.setup-bats
        uses: mig4/setup-bats@af9a00deb21b5d795cabfeaa8d9060410377686d # v1.2.0
        with:
          bats-version: 1.9.0

      - name: Run Test Suite
        shell: bash
        env:
          TEST_CMD: ${{ inputs.test-command }}
          GOTESTSUM_JSONFILE: gotestsum.json
        run: eval "${TEST_CMD}"

      - name: Annotate Test Suite Results
        if: ${{ (success() || failure()) && hashFiles('gotestsum.json') != '' }}
        uses: guyarb/golang-test-annotations@96fc379b171c49932041d6c789e73331a7bdeec1 # v0.9.0
        with:
          test-results: gotestsum.json

      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: inputs.run-codecov && matrix.go == 'stable'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out # optional
          name: codecov-umbrella # optional
          fail_ci_if_error: false # optional (default = false)
